<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Japanese vocabulary drill</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Lessons 1–2 vocabulary</h1>
    <p class="sub">Greetings, school life, time, numbers, family, pointing words, food, things, places and shopping, plus hiragana.</p>

    <!-- Exercise type -->
    <nav class="modes" id="modes" aria-label="Exercise type">
      <button data-mode="flash">Flashcards</button>
      <button data-mode="quiz">Quiz</button>
      <button data-mode="type">Type it</button>
      <button data-mode="num">Numbers</button>
      <button data-mode="sit">Situations</button>
      <button data-mode="sen">Sentences</button>
      <button data-mode="kana">Hiragana</button>
    </nav>
    <p class="hint" id="hint"></p>

    <!-- Word-group chips (filled by script.js) -->
    <div id="wordOpts">
      <div class="chip-groups" id="chips" role="group" aria-label="Word groups"></div>
    </div>

    <!-- Number-set chips (filled by script.js) -->
    <div id="numOpts">
      <div class="chips" id="numChips" role="group" aria-label="Number sets"></div>
    </div>

    <!-- Hiragana-row chips (filled by script.js) -->
    <div id="kanaOpts">
      <div class="chips" id="kanaChips" role="group" aria-label="Hiragana rows"></div>
    </div>

    <div class="row">
      <div class="seg" id="numSeg" role="group" aria-label="How to practise numbers">
        <button data-nd="say">Say it</button>
        <button data-nd="read">Read it</button>
        <button data-nd="listen">Listen</button>
      </div>
      <div class="seg" id="kanaSeg" role="group" aria-label="How to practise hiragana">
        <button data-kd="read">Read it</button>
        <button data-kd="find">Find it</button>
      </div>
      <div class="seg" id="dirSeg" role="group" aria-label="Which side to show first">
        <button data-dir="jp">Japanese first</button>
        <button data-dir="en">English first</button>
      </div>
      <label class="check" id="kanaCheck"><input type="checkbox" id="kana"> Show kana</label>
    </div>

    <!-- The current exercise is rendered here -->
    <main id="stage"></main>

    <!-- Screen-reader announcements -->
    <p id="live" class="sr" aria-live="polite"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
