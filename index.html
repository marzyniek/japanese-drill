<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson 1 vocabulary drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6;--sheet:#FFFFFF;--ink:#1E2B4A;--muted:#5E6880;--line:#D5DBE6;
  --shu:#C2362B;--shu-soft:#FBEDEB;--focus:#3D63C9;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#141925;--sheet:#1C2332;--ink:#E4E9F2;--muted:#98A2B6;--line:#2D3750;--shu:#E7604F;--shu-soft:#3A2326;--focus:#8EA9F0;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#141925;--sheet:#1C2332;--ink:#E4E9F2;--muted:#98A2B6;--line:#2D3750;--shu:#E7604F;--shu-soft:#3A2326;--focus:#8EA9F0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Klee One","Hiragino Mincho ProN",serif;font-weight:600;font-size:1.8rem;line-height:1.2;margin:6px 0 4px}
.sub{margin:0 0 18px;color:var(--muted);font-size:.95rem}
.modes{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 4px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:500;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.hint{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:.88rem;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--sheet)}
.chip.missed{border-style:solid;border-color:var(--shu);color:var(--shu)}
.chip.missed[aria-pressed="true"]{background:var(--shu-soft)}
.chips.dim .chip:not(.missed){opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:700}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--ink);width:18px;height:18px;margin:0}
.prog{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.card{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:20px;min-height:200px;padding:34px 22px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;overflow:hidden}
.card.flip{cursor:pointer;-webkit-tap-highlight-color:transparent}
.word{font-family:"Klee One","Hiragino Mincho ProN",serif;font-weight:600;font-size:clamp(1.9rem,8.5vw,2.6rem);line-height:1.2}
.kana{display:none;font-family:"Klee One",serif;font-size:1.2rem;color:var(--muted)}
.kana-on .kana{display:block}
.meaning{font-size:clamp(1.3rem,6vw,1.6rem);font-weight:500;line-height:1.3}
.situ{font-size:1.2rem;font-weight:500;line-height:1.45;max-width:30ch}
.back{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;width:100%}
.tap{font-size:.85rem;color:var(--muted);margin-top:14px}
.stamp{position:absolute;top:8px;right:8px;width:70px;height:70px;pointer-events:none;opacity:.9}
.stamp svg{width:100%;height:100%;display:block}
.stamp path{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:320;stroke-dashoffset:320;animation:draw .5s ease-out forwards}
.maru path{stroke:var(--shu)}
.batsu path{stroke:var(--muted);stroke-dasharray:80;stroke-dashoffset:80;animation-duration:.2s}
.batsu path+path{animation-delay:.18s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.stamp path{animation:none;stroke-dashoffset:0}.bar i{transition:none}}
.opts-list{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;font-size:1.02rem}
.opt .k{display:none;font-family:"Klee One",serif;font-size:.9rem;color:var(--muted)}
.kana-on .opt .k{display:block}
.opt.jp .t{font-family:"Klee One",serif;font-weight:600;font-size:1.12rem}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.45}
.opt.right{border:2px solid var(--shu);padding:12px 15px}
.opt.right::after{content:"◯";color:var(--shu);font-weight:700;flex:none}
.opt.wrong{opacity:.6}
.opt.wrong::after{content:"✕";color:var(--muted);flex:none}
.field{display:flex;gap:8px;margin-top:14px}
.field input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink)}
.field input:disabled{opacity:.7}
.field .btn{flex:none}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px 2px;cursor:pointer;font-size:.92rem}
.feedback{margin:14px 2px 0;font-size:1rem;line-height:1.6}
.w{font-family:"Klee One",serif;font-weight:600;font-size:1.08em}
.kana-inline{font-family:"Klee One",serif;color:var(--muted);margin-left:4px}
.yours{color:var(--muted);font-size:.92rem}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;font-weight:700;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:12px;padding:12px 16px;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.slot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%;min-height:54px;margin-top:16px;padding:6px 0 8px;border-bottom:2px solid var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{font-family:"Klee One",serif;font-weight:600;font-size:1.05rem;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:7px 12px;cursor:pointer}
.slot .tile{border-color:var(--ink);background:transparent}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.score{font-size:1.1rem;color:var(--muted)}
.score .big{font-family:"Klee One",serif;font-weight:600;font-size:3.4rem;color:var(--ink);line-height:1;margin-right:6px}
.end-note{margin:6px 0 0;color:var(--muted)}
h2{font-size:1rem;margin:24px 0 6px;color:var(--muted)}
.misslist{list-style:none;padding:0;margin:0}
.misslist li{display:flex;justify-content:space-between;gap:14px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.misslist li span:last-child{text-align:right}
.play{flex:none;padding:14px 26px;font-size:1.05rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lesson 1 vocabulary</h1>
  <p class="sub">Greetings, school life, time, numbers, countries, majors, jobs and family.</p>

  <nav class="modes" id="modes" aria-label="Exercise type">
    <button data-mode="flash">Flashcards</button>
    <button data-mode="quiz">Quiz</button>
    <button data-mode="type">Type it</button>
    <button data-mode="num">Numbers</button>
    <button data-mode="sit">Situations</button>
    <button data-mode="sen">Sentences</button>
  </nav>
  <p class="hint" id="hint"></p>

  <div id="wordOpts">
    <div class="chips" id="chips" role="group" aria-label="Word groups"></div>
  </div>
  <div id="numOpts">
    <div class="chips" id="numChips" role="group" aria-label="Number sets"></div>
  </div>
  <div class="row">
    <div class="seg" id="numSeg" role="group" aria-label="How to practise numbers">
      <button data-nd="say">Say it</button>
      <button data-nd="read">Read it</button>
      <button data-nd="listen">Listen</button>
    </div>
    <div class="seg" id="dirSeg" role="group" aria-label="Which side to show first">
      <button data-dir="jp">Japanese first</button>
      <button data-dir="en">English first</button>
    </div>
    <label class="check"><input type="checkbox" id="kana"> Show kana</label>
  </div>

  <main id="stage"></main>
  <p id="live" class="sr" aria-live="polite"></p>
</div>

<script>
const CATS=[["greet","Greetings"],["expr","Expressions"],["school","School & people"],["time","Time"],["num","Numbers"],["basics","Nationality & phone"],["country","Countries"],["major","Majors"],["job","Jobs"],["family","Family"]];
const W=[
["Ohayoo.","おはよう","Good morning.","greet"],
["Ohayoo gozaimasu.","おはようございます","Good morning. (polite)","greet"],
["Konnichiwa.","こんにちは","Good afternoon.","greet"],
["Konbanwa.","こんばんは","Good evening.","greet"],
["Sayoonara.","さようなら","Good-bye.","greet"],
["Oyasumi (nasai).","おやすみ(なさい)","Good night.","greet"],
["Arigatoo.","ありがとう","Thank you.","greet"],
["Arigatoo gozaimasu.","ありがとうございます","Thank you. (polite)","greet"],
["Sumimasen.","すみません","Excuse me.; I'm sorry.","greet"],
["Iie.","いいえ","No.; Not at all.","greet"],
["Itte kimasu.","いってきます","I'll go and come back.","greet"],
["Itterasshai.","いってらっしゃい","Please go and come back.","greet"],
["Tadaima.","ただいま","I'm home.","greet"],
["Okaeri (nasai).","おかえり(なさい)","Welcome home.","greet"],
["Itadakimasu.","いただきます","Thank you for the meal. (before eating)","greet"],
["Gochisoosama (deshita).","ごちそうさま(でした)","Thank you for the meal. (after eating)","greet"],
["Hajimemashite.","はじめまして","How do you do?","greet"],
["… desu.","～です","I am ….","greet"],
["Yoroshiku onegai shimasu.","よろしくおねがいします","Nice to meet you.","greet"],
["anoo","あのう","um …","expr"],
["hai","はい","yes","expr"],
["soo desu","そうです","That's right.","expr"],
["soo desu ka","そうですか","I see.; Is that so?","expr"],
["daigaku","だいがく","college; university","school"],
["kookoo","こうこう","high school","school"],
["gakusee","がくせい","student","school"],
["daigakusee","だいがくせい","college student","school"],
["ryuugakusee","りゅうがくせい","international student","school"],
["sensee","せんせい","teacher; Professor …","school"],
["… nensee","～ねんせい","… year student","school"],
["ichinensee","いちねんせい","first-year student","school"],
["senkoo","せんこう","major","school"],
["watashi","わたし","I","school"],
["tomodachi","ともだち","friend","school"],
["… san","～さん","Mr./Ms. …","school"],
["… jin","～じん","… people","school"],
["nihonjin","にほんじん","Japanese people","school"],
["ima","いま","now","time"],
["gozen","ごぜん","A.M.","time"],
["gogo","ごご","P.M.","time"],
["… ji","～じ","o'clock","time"],
["ichiji","いちじ","one o'clock","time"],

["niji han","にじはん","half past two","time"],
["zero/rei","ゼロ/れい","0","num"],
["ichi","いち","1","num"],
["ni","に","2","num"],
["san","さん","3","num"],
["yon/shi","よん/し","4","num"],
["go","ご","5","num"],
["roku","ろく","6","num"],
["nana/shichi","なな/しち","7","num"],
["hachi","はち","8","num"],
["kyuu/ku","きゅう/く","9","num"],
["juu","じゅう","10","num"],
["hyaku","ひゃく","100","num"],
["sen","せん","1,000","num"],
["ichiman","いちまん","10,000","num"],
["Nihon","にほん","Japan","basics"],
["Amerika","アメリカ","U.S.A.","basics"],
["… go","～ご","… language","basics"],
["nihongo","にほんご","Japanese language","basics"],
["… sai","～さい","… years old","basics"],
["denwa","でんわ","telephone","basics"],
["… ban","～ばん","number …","basics"],
["bangoo","ばんごう","number","basics"],
["namae","なまえ","name","basics"],
["nan/nani","なん/なに","what","basics"],
["Igirisu","イギリス","Britain","country"],
["Oosutoraria","オーストラリア","Australia","country"],
["Kankoku","かんこく","Korea","country"],
["Kanada","カナダ","Canada","country"],
["Chuugoku","ちゅうごく","China","country"],
["Indo","インド","India","country"],
["Ejiputo","エジプト","Egypt","country"],
["Firipin","フィリピン","Philippines","country"],
["Cheko","チェコ","Czech Republic","country"],
["ajia kenkyuu","アジアけんきゅう","Asian studies","major"],
["keezai","けいざい","economics","major"],
["koogaku","こうがく","engineering","major"],
["kokusaikankee","こくさいかんけい","international relations","major"],
["konpyuutaa","コンピューター","computer","major"],
["seeji","せいじ","politics","major"],
["seebutsugaku","せいぶつがく","biology","major"],
["bijinesu","ビジネス","business","major"],
["bungaku","ぶんがく","literature","major"],
["rekishi","れきし","history","major"],
["isha","いしゃ","doctor","job"],
["kaishain","かいしゃいん","office worker","job"],
["kangoshi","かんごし","nurse","job"],
["kookoosee","こうこうせい","high school student","job"],
["shufu","しゅふ","housewife","job"],
["daigakuinsee","だいがくいんせい","graduate student","job"],
["bengoshi","べんごし","lawyer","job"],
["okaasan","おかあさん","mother","family"],
["otoosan","おとうさん","father","family"],
["oneesan","おねえさん","older sister","family"],
["oniisan","おにいさん","older brother","family"],
["imooto","いもうと","younger sister","family"],
["otooto","おとうと","younger brother","family"]
];
const SIT=[
["You're leaving home in the morning.","Itte kimasu."],
["Your roommate is heading out the door.","Itterasshai."],
["You walk in the door after class.","Tadaima."],
["Someone in your family just got home.","Okaeri (nasai)."],
["The food is on the table and you're about to eat.","Itadakimasu."],
["You've just finished eating at a friend's house.","Gochisoosama (deshita)."],
["You meet someone for the very first time.","Hajimemashite."],
["You've finished introducing yourself.","Yoroshiku onegai shimasu."],
["You see your professor at 9 a.m.","Ohayoo gozaimasu."],
["You see a close friend at 9 a.m.","Ohayoo."],
["You run into a neighbour at 2 p.m.","Konnichiwa."],
["You meet someone at 8 p.m.","Konbanwa."],
["You're about to go to bed.","Oyasumi (nasai)."],
["Your teacher helped you with your homework.","Arigatoo gozaimasu."],
["A friend passes you the salt.","Arigatoo."],
["You bump into someone on the train.","Sumimasen."],
["Someone thanks you and you want to say \"not at all\".","Iie."],
["Class is over and you're saying good-bye to the teacher.","Sayoonara."],
["You hesitate before asking a stranger something.","anoo"],
["Someone checks a fact with you and they're correct.","soo desu"],
["A friend tells you something you didn't know.","soo desu ka"]
];
const SEN=[
{en:"I'm a college student.",jp:"watashi wa daigakusee desu",x:["gakusee","ka"]},
{en:"I'm an international student.",jp:"watashi wa ryuugakusee desu",x:["sensee","no"]},
{en:"My major is computers.",jp:"watashi no senkoo wa konpyuutaa desu",x:["koogaku","ka"]},
{en:"It's half past two now.",jp:"ima niji han desu",x:["ichiji","gogo"]},
{en:"It's one p.m.",jp:"gogo ichiji desu",x:["gozen","han"]},
{en:"Is Mr. Tanaka Japanese?",jp:"Tanaka san wa nihonjin desu ka",x:["nihongo","no"]},
{en:"Is Takeshi a first-year student?",jp:"Takeshi san wa ichinensee desu ka",x:["sensee","no"]},
{en:"My friend is a Japanese language teacher.",jp:"tomodachi wa nihongo no sensee desu",x:["nihonjin","ka"]},
{en:"What is your name?",jp:"namae wa nan desu ka",x:["nani","no"]},
{en:"Yes, that's right.",jp:"hai soo desu",x:["ka","iie"]},
{en:"What is the telephone number?",jp:"denwa bangoo wa nan desu ka",x:["namae","nani"]},
{en:"Mary is American.",jp:"Mearii san wa amerikajin desu",x:["amerika","nihonjin"]},
{en:"Is your older sister a nurse?",jp:"oneesan wa kangoshi desu ka",x:["oniisan","isha"]},
{en:"Um, excuse me. What time is it now?",jp:"anoo sumimasen ima nanji desu ka",x:["nani","han"]},
{en:"Is it 1 a.m. in Japan now?",jp:"Nihon wa ima gozen ichiji desu ka",x:["gogo","no"]},
{en:"Professor Yamashita is a history teacher.",jp:"Yamashita sensee wa rekishi no sensee desu",x:["san","bungaku"]}
];
const WORD_MODES=["flash","quiz","type"];
const HINTS={
  flash:"Flip the card, then mark whether you knew it.",
  quiz:"Pick the matching answer.",
  type:"Read the English and type the Japanese, in romaji or kana.",
  sit:"Pick what you would say in each situation.",
  sen:"Tap the words in the right order to build the sentence."
};
const NUMHINT={
  say:"Type how you say it in Japanese, in romaji or kana.",
  read:"Type the number in digits.",
  listen:"Listen, then type the number in digits."
};
const NUMSETS=[["small","0–10"],["tens","11–100"],["big","100–99,999"],["time","Time"],["age","Ages"],["phone","Phone numbers"]];
const MARU='<svg viewBox="0 0 100 100"><path d="M52 14C76 13 90 31 88 53C86 76 66 89 45 87C24 85 11 67 13 46C15 27 31 15 56 16"/></svg>';
const BATSU='<svg viewBox="0 0 100 100"><path d="M26 26L74 74"/><path d="M74 26L26 74"/></svg>';

const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem("l1drill:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("l1drill:"+k,JSON.stringify(v))}catch(e){}}
};
const words=W.map(([jp,kana,en,cat])=>({jp,kana,en,cat}));
const POOL=words.filter(w=>(w.cat==="greet"||w.cat==="expr")&&w.jp!=="… desu.");
let missed=store.get("missed",{});
if(typeof missed!=="object"||!missed)missed={};
const validCats=new Set(CATS.map(c=>c[0]));
let savedCats=(store.get("cats",["greet","school"])||[]).filter(c=>validCats.has(c));
if(!savedCats.length)savedCats=["greet","school"];
const S={mode:store.get("mode","quiz"),cats:new Set(savedCats),dir:store.get("dir","jp"),kana:!!store.get("kana",false),onlyMissed:false};
const validSets=new Set(NUMSETS.map(c=>c[0]));
let savedSets=(store.get("numSets",["small","tens"])||[]).filter(c=>validSets.has(c));
if(!savedSets.length)savedSets=["small","tens"];
S.numSets=new Set(savedSets);
S.numDir=store.get("numDir","say");
if(!NUMHINT[S.numDir])S.numDir="say";
if(!HINTS[S.mode]&&S.mode!=="num")S.mode="quiz";
let R=null;
const stage=$("#stage"),live=$("#live");

function save(){store.set("mode",S.mode);store.set("cats",[...S.cats]);store.set("dir",S.dir);store.set("kana",S.kana);store.set("numSets",[...S.numSets]);store.set("numDir",S.numDir)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){
  s=s.toLowerCase().normalize("NFC");
  s=s.replace(/[āâ]/g,"aa").replace(/[īî]/g,"ii").replace(/[ūû]/g,"uu").replace(/[ēê]/g,"ee").replace(/[ōô]/g,"oo");
  s=s.replace(/[\s.…,!?'’\-~～。、「」()（）]/g,"");
  return s.replace(/ou/g,"oo").replace(/ei/g,"ee");
}
function expand(s){const m=s.match(/\(([^)]*)\)/);return m?[s.replace(m[0],""),s.replace(m[0],m[1])]:[s]}
function forms(w){const out=[];for(const src of [w.jp,w.kana])for(const p of src.split("/"))out.push(...expand(p));return out.map(norm)}
function fmt(s){return s.charAt(0).toUpperCase()+s.slice(1)+(/ ka$/.test(s)?"?":".")}
function miss(w){missed[w.jp]=(missed[w.jp]||0)+1;store.set("missed",missed)}
function clearMiss(w){if(missed[w.jp]){delete missed[w.jp];store.set("missed",missed)}}

function renderControls(){
  document.body.classList.toggle("kana-on",S.kana);
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
  const isNum=S.mode==="num";
  $("#hint").textContent=isNum?NUMHINT[S.numDir]:HINTS[S.mode];
  $("#numOpts").hidden=!isNum;$("#numSeg").hidden=!isNum;
  $("#numChips").innerHTML=NUMSETS.map(([k,l])=>`<button class="chip" data-set="${k}" aria-pressed="${S.numSets.has(k)}">${l}</button>`).join("");
  document.querySelectorAll("#numSeg button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.nd===S.numDir);if(b.dataset.nd==="listen")b.hidden=!jaVoice()&&S.numDir!=="listen"});
  $("#wordOpts").hidden=!WORD_MODES.includes(S.mode);
  $("#dirSeg").hidden=!(S.mode==="flash"||S.mode==="quiz");
  document.querySelectorAll("#dirSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dir===S.dir));
  $("#kana").checked=S.kana;
  const n=Object.keys(missed).length;
  if(!n)S.onlyMissed=false;
  const chips=$("#chips");
  chips.innerHTML=CATS.map(([k,l])=>`<button class="chip" data-cat="${k}" aria-pressed="${S.cats.has(k)}">${l}</button>`).join("")
    +(n?`<button class="chip missed" data-missed="1" aria-pressed="${S.onlyMissed}">Missed words (${n})</button>`:"");
  chips.classList.toggle("dim",S.onlyMissed);
}

$("#modes").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.mode=b.dataset.mode;save();renderControls();startRound()});
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.missed){S.onlyMissed=!S.onlyMissed}
  else{S.onlyMissed=false;const k=b.dataset.cat;if(S.cats.has(k)){if(S.cats.size>1)S.cats.delete(k)}else S.cats.add(k)}
  save();renderControls();startRound();
});
$("#dirSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.dir=b.dataset.dir;save();renderControls();startRound()});
$("#numChips").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const k=b.dataset.set;
  if(S.numSets.has(k)){if(S.numSets.size>1)S.numSets.delete(k)}else S.numSets.add(k);
  save();renderControls();startRound();
});
$("#numSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.numDir=b.dataset.nd;save();renderControls();startRound()});
if(canSpeak)speechSynthesis.addEventListener("voiceschanged",renderControls);
$("#kana").addEventListener("change",e=>{S.kana=e.target.checked;save();document.body.classList.toggle("kana-on",S.kana)});

const canSpeak="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
function jaVoice(){try{return canSpeak&&speechSynthesis.getVoices().some(v=>/^ja/i.test(v.lang))}catch(e){return false}}
function speak(t){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";
    const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}
const P=(r,k)=>({r:r.split("|"),k:k.split("|")});
const DIG=["","ichi","ni","san","yon","go","roku","nana","hachi","kyuu"];
const DIGK=["","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
const UNIT=[P("zero|rei","ゼロ|れい"),P("ichi","いち"),P("ni","に"),P("san","さん"),P("yon|shi","よん|し"),P("go","ご"),P("roku","ろく"),P("nana|shichi","なな|しち"),P("hachi","はち"),P("kyuu|ku","きゅう|く")];
const HUN=[null,P("hyaku","ひゃく"),P("nihyaku","にひゃく"),P("sanbyaku","さんびゃく"),P("yonhyaku","よんひゃく"),P("gohyaku","ごひゃく"),P("roppyaku","ろっぴゃく"),P("nanahyaku","ななひゃく"),P("happyaku","はっぴゃく"),P("kyuuhyaku","きゅうひゃく")];
const THO=[null,P("sen","せん"),P("nisen","にせん"),P("sanzen","さんぜん"),P("yonsen","よんせん"),P("gosen","ごせん"),P("rokusen","ろくせん"),P("nanasen","ななせん"),P("hassen","はっせん"),P("kyuusen","きゅうせん")];
const HOURS=[P("ichiji","いちじ"),P("niji","にじ"),P("sanji","さんじ"),P("yoji","よじ"),P("goji","ごじ"),P("rokuji","ろくじ"),P("shichiji","しちじ"),P("hachiji","はちじ"),P("kuji","くじ"),P("juuji","じゅうじ"),P("juuichiji","じゅういちじ"),P("juuniji","じゅうにじ")];
const PH=[P("zero|rei","ゼロ|れい"),P("ichi","いち"),P("ni|nii","に|にい"),P("san","さん"),P("yon","よん"),P("go|goo","ご|ごお"),P("roku","ろく"),P("nana","なな"),P("hachi","はち"),P("kyuu","きゅう")];
const SAI=[null,P("issai","いっさい"),P("nisai","にさい"),P("sansai","さんさい"),P("yonsai","よんさい"),P("gosai","ごさい"),P("rokusai","ろくさい"),P("nanasai","ななさい"),P("hassai|hachisai","はっさい|はちさい"),P("kyuusai","きゅうさい")];
function tensPart(t){return t===7?P("nanajuu|shichijuu","ななじゅう|しちじゅう"):P((t===1?"":DIG[t])+"juu",(t===1?"":DIGK[t])+"じゅう")}
function numParts(n){
  if(n===0)return [UNIT[0]];
  const p=[],m=Math.floor(n/10000),th=Math.floor(n/1000)%10,h=Math.floor(n/100)%10,t=Math.floor(n/10)%10,u=n%10;
  if(m)p.push(P(DIG[m]+"man",DIGK[m]+"まん"));
  if(th)p.push(THO[th]);if(h)p.push(HUN[h]);if(t)p.push(tensPart(t));if(u)p.push(UNIT[u]);
  return p;
}
function ageParts(n){
  if(n===20)return [P("hatachi|nijussai|nijuussai","はたち|にじゅっさい|にじゅうさい")];
  const t=Math.floor(n/10),u=n%10,pre=t===1?"":DIG[t],preK=t===1?"":DIGK[t];
  if(!u)return [P(`${pre}jussai|${pre}juussai|${pre}jissai`,`${preK}じゅっさい|${preK}じゅうさい|${preK}じっさい`)];
  return t?[tensPart(t),SAI[u]]:[SAI[u]];
}
function mk(parts,sep,prompt,digits){
  const rx=key=>new RegExp("^"+parts.map(p=>"(?:"+p[key].map(norm).join("|")+")").join("")+"$");
  return {prompt,digits,jp:parts.map(p=>p.r[0]).join(sep),kana:parts.map(p=>p.k[0]).join(sep),reR:rx("r"),reK:rx("k")};
}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const GEN={
  small(){const n=ri(0,10);return mk(numParts(n),"",String(n),[String(n)])},
  tens(){const n=ri(11,100);return mk(numParts(n),"",String(n),[String(n)])},
  big(){
    const r=Math.random();let n;
    if(r<.35)n=ri(1,9)*(Math.random()<.5?100:1000);
    else if(r<.6)n=ri(101,999);else if(r<.85)n=ri(1001,9999);else n=ri(10000,99999);
    return mk(numParts(n),"",n.toLocaleString("en-US"),[String(n)]);
  },
  time(){
    const h=ri(1,12),half=Math.random()<.5,ap=Math.random()<.4?(Math.random()<.5?"am":"pm"):"";
    const parts=[];if(ap)parts.push(ap==="am"?P("gozen","ごぜん"):P("gogo","ごご"));
    parts.push(HOURS[h-1]);if(half)parts.push(P("han","はん"));
    const label=`${h}:${half?"30":"00"}${ap?(ap==="am"?" a.m.":" p.m."):""}`;
    return mk(parts," ",label,half?[`${h}30`]:[`${h}00`,`${h}`]);
  },
  age(){const n=Math.random()<.6?ri(1,30):ri(31,99);return mk(ageParts(n),"",`${n} years old`,[String(n)])},
  phone(){
    const a=[ri(1,9),ri(0,9),ri(0,9)],b=[ri(0,9),ri(0,9),ri(0,9),ri(0,9)];
    return mk([...a.map(d=>PH[d]),P("no","の"),...b.map(d=>PH[d])]," ",a.join("")+"-"+b.join(""),[a.join("")+b.join("")]);
  }
};

function rNum(){
  const it=R.items[R.i],d=S.numDir;
  let prompt;
  if(d==="say")prompt=`<div class="word">${it.prompt}</div>`;
  else if(d==="read")prompt=jpHTML(it);
  else prompt=`<button class="btn ghost play" id="play" type="button">▶ Play</button>`;
  stage.innerHTML=head()+`<div class="card" id="card">${prompt}</div>
  <div class="field"><input id="inp" type="text" ${d==="say"?"":'inputmode="numeric"'} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${d==="say"?"Romaji or kana":"Digits"}" aria-label="Your answer"><button class="btn" id="chk">Check</button></div>
  <button class="link" id="idk">Show answer</button><div id="fb"></div>`;
  const inp=$("#inp");
  if(d==="listen"){$("#play").onclick=()=>speak(it.kana);speak(it.kana)}
  const check=give=>{
    if(R.answered)return;
    const v=inp.value.trim();
    if(!give&&!v){inp.focus();return}
    R.answered=true;inp.disabled=true;$("#chk").disabled=true;$("#idk").hidden=true;
    const ok=!give&&(d==="say"?(it.reR.test(norm(v))||it.reK.test(norm(v))):it.digits.includes(v.replace(/\D/g,"")));
    const ans=`<span class="w">${it.prompt}</span> = <span class="w">${it.jp}</span><span class="kana-inline" lang="ja">${it.kana}</span>`;
    const yours=!ok&&v&&!give?`<br><span class="yours">You wrote <s>${esc(v)}</s></span>`:"";
    const hear=jaVoice()?`<br><button class="link" id="hear" type="button">Hear it</button>`:"";
    result(ok,(ok?"":"Answer: ")+ans+yours+hear,null);
    const hb=$("#hear");if(hb)hb.onclick=()=>speak(it.kana);
  };
  $("#chk").onclick=()=>check(false);
  $("#idk").onclick=()=>check(true);
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check(false)}};
  inp.focus({preventScroll:true});
}

function startRound(pool){
  let items;
  if(WORD_MODES.includes(S.mode)){
    if(!pool||!pool.length){
      pool=S.onlyMissed?words.filter(w=>missed[w.jp]):[];
      if(!pool.length){S.onlyMissed=false;pool=words.filter(w=>S.cats.has(w.cat))}
    }
    items=shuffle(pool).slice(0,20);
  }else if(S.mode==="num"){
    const sets=[...S.numSets],seen=new Set();items=[];let guard=0;
    while(items.length<15&&guard++<400){const it=GEN[sets[ri(0,sets.length-1)]]();if(seen.has(it.prompt))continue;seen.add(it.prompt);items.push(it)}
  }else if(S.mode==="sit")items=shuffle(SIT).slice(0,12);
  else items=shuffle(SEN).slice(0,10);
  R={items,i:0,right:0,wrong:[],n:items.length,again:new Set(),answered:false};
  render();
}

function render(){
  if(R.i>=R.items.length)return renderEnd();
  R.answered=false;
  ({flash:rFlash,quiz:rQuiz,type:rType,num:rNum,sit:rSit,sen:rSen})[S.mode]();
}
function head(){return `<div class="prog"><span>${R.i+1} of ${R.items.length}</span><span id="sc">${R.right} correct</span></div><div class="bar"><i style="width:${R.i/R.items.length*100}%"></i></div>`}
function jpHTML(w){return `<div class="word" lang="ja-Latn">${w.jp}</div><div class="kana" lang="ja">${w.kana}</div>`}
function enHTML(w){return `<div class="meaning">${w.en}</div>`}

function stamp(ok){
  const c=$("#card");if(!c)return;
  const s=document.createElement("div");
  s.className="stamp "+(ok?"maru":"batsu");s.setAttribute("aria-hidden","true");
  s.innerHTML=ok?MARU:BATSU;c.appendChild(s);
}
function result(ok,fbHTML,w){
  stamp(ok);
  if(ok){R.right++;if(w)clearMiss(w)}else{R.wrong.push(R.items[R.i]);if(w)miss(w)}
  live.textContent=ok?"Correct":"Not quite";
  $("#sc").textContent=R.right+" correct";
  const last=R.i+1>=R.items.length;
  $("#fb").innerHTML=(fbHTML?`<p class="feedback">${fbHTML}</p>`:"")+`<div class="actions"><button class="btn" id="next">${last?"See results":"Next"}</button></div>`;
  const nx=$("#next");
  nx.onclick=()=>{R.i++;render()};
  nx.focus({preventScroll:true});
  nx.scrollIntoView({block:"nearest"});
}
function choose(btns,choices,idx,ans,cb){
  if(R.answered)return;R.answered=true;
  const ok=choices[idx]===ans;
  btns.forEach((b,i)=>{b.disabled=true;if(choices[i]===ans)b.classList.add("right");else if(i===idx)b.classList.add("wrong")});
  cb(ok);
}
function distractors(w,pool,n){
  const same=shuffle(pool.filter(x=>x!==w&&x.cat===w.cat));
  const rest=shuffle(pool.filter(x=>x!==w&&x.cat!==w.cat));
  return [...same,...rest].slice(0,n);
}
function optList(choices,jpSide){
  return `<div class="opts-list">${choices.map((c,i)=>jpSide
    ?`<button class="opt jp" data-i="${i}"><span><span class="t" lang="ja-Latn">${c.jp}</span><span class="k" lang="ja">${c.kana}</span></span></button>`
    :`<button class="opt" data-i="${i}"><span class="t">${c.en}</span></button>`).join("")}</div>`;
}

function rFlash(){
  const w=R.items[R.i];
  const front=S.dir==="jp"?jpHTML(w):enHTML(w);
  const back=S.dir==="jp"?enHTML(w):jpHTML(w);
  stage.innerHTML=head()+`<div class="card flip" id="card" role="button" tabindex="0" aria-expanded="false">${front}<div class="back" id="back" hidden>${back}</div><div class="tap" id="tap">Tap to reveal</div></div>
  <div class="actions" id="act" hidden><button class="btn ghost" id="again">Again</button><button class="btn" id="got">Got it</button></div>`;
  const card=$("#card");
  const open=()=>{
    if(card.getAttribute("aria-expanded")==="true")return;
    card.setAttribute("aria-expanded","true");
    $("#back").hidden=false;$("#tap").hidden=true;$("#act").hidden=false;
    $("#got").focus({preventScroll:true});
  };
  card.onclick=open;
  card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}};
  $("#again").onclick=()=>{
    if(!R.again.has(w.jp)){R.again.add(w.jp);R.wrong.push(w);R.items.push(w)}
    miss(w);R.i++;render();
  };
  $("#got").onclick=()=>{if(!R.again.has(w.jp)){R.right++;clearMiss(w)}R.i++;render()};
  card.focus({preventScroll:true});
}

function rQuiz(){
  const w=R.items[R.i];
  const choices=shuffle([w,...distractors(w,words,3)]);
  stage.innerHTML=head()+`<div class="card" id="card">${S.dir==="jp"?jpHTML(w):enHTML(w)}</div>${optList(choices,S.dir==="en")}<div id="fb"></div>`;
  const btns=[...stage.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>choose(btns,choices,+b.dataset.i,w,ok=>
    result(ok,ok?"":`<span class="w">${w.jp}</span><span class="kana-inline" lang="ja">${w.kana}</span> means “${w.en}”`,w)));
}

function rType(){
  const w=R.items[R.i];
  stage.innerHTML=head()+`<div class="card" id="card">${enHTML(w)}</div>
  <div class="field"><input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Romaji or kana" aria-label="Your answer in Japanese"><button class="btn" id="chk">Check</button></div>
  <button class="link" id="idk">Show answer</button><div id="fb"></div>`;
  const inp=$("#inp");
  const check=give=>{
    if(R.answered)return;
    const v=inp.value.trim();
    if(!give&&!v){inp.focus();return}
    R.answered=true;inp.disabled=true;$("#chk").disabled=true;$("#idk").hidden=true;
    const ok=!give&&forms(w).includes(norm(v));
    const ansHTML=`<span class="w">${w.jp}</span><span class="kana-inline" lang="ja">${w.kana}</span>`;
    result(ok,ok?ansHTML:`Answer: ${ansHTML}${v&&!give?`<br><span class="yours">You wrote <s>${esc(v)}</s></span>`:""}`,w);
  };
  $("#chk").onclick=()=>check(false);
  $("#idk").onclick=()=>check(true);
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check(false)}};
  inp.focus({preventScroll:true});
}

function rSit(){
  const s=R.items[R.i];
  const ans=words.find(w=>w.jp===s[1]);
  const choices=shuffle([ans,...shuffle(POOL.filter(w=>w!==ans)).slice(0,3)]);
  stage.innerHTML=head()+`<div class="card" id="card"><div class="situ">${s[0]}</div></div>${optList(choices,true)}<div id="fb"></div>`;
  const btns=[...stage.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>choose(btns,choices,+b.dataset.i,ans,ok=>
    result(ok,`<span class="w">${ans.jp}</span><span class="kana-inline" lang="ja">${ans.kana}</span> means “${ans.en}”`,null)));
}

function rSen(){
  const s=R.items[R.i];
  const tiles=shuffle([...s.jp.split(" "),...s.x]).map((t,id)=>({t,id}));
  let picked=[];
  stage.innerHTML=head()+`<div class="card" id="card"><div class="meaning">${s.en}</div><div class="slot" id="slot" aria-label="Your sentence"></div></div>
  <div class="bank" id="bank">${tiles.map(o=>`<button class="tile" data-id="${o.id}" lang="ja-Latn">${o.t}</button>`).join("")}</div>
  <div class="actions" id="sact"><button class="btn ghost" id="clr">Clear</button><button class="btn" id="chk" disabled>Check</button></div><div id="fb"></div>`;
  const slot=$("#slot"),bank=$("#bank");
  const draw=()=>{
    slot.innerHTML=picked.map(id=>`<button class="tile" data-id="${id}" lang="ja-Latn" aria-label="Remove ${tiles[id].t}">${tiles[id].t}</button>`).join("");
    bank.querySelectorAll(".tile").forEach(b=>b.classList.toggle("used",picked.includes(+b.dataset.id)));
    $("#chk").disabled=!picked.length;
  };
  bank.onclick=e=>{const b=e.target.closest(".tile");if(!b||R.answered)return;const id=+b.dataset.id;if(!picked.includes(id)){picked.push(id);draw()}};
  slot.onclick=e=>{const b=e.target.closest(".tile");if(!b||R.answered)return;picked=picked.filter(x=>x!==+b.dataset.id);draw()};
  $("#clr").onclick=()=>{if(R.answered)return;picked=[];draw()};
  $("#chk").onclick=()=>{
    if(R.answered)return;R.answered=true;
    const ok=picked.map(id=>tiles[id].t).join(" ")===s.jp;
    stage.querySelectorAll(".tile").forEach(b=>b.disabled=true);
    $("#sact").hidden=true;
    result(ok,ok?`<span class="w">${fmt(s.jp)}</span>`:`Answer: <span class="w">${fmt(s.jp)}</span>`,null);
  };
}

function renderEnd(){
  const total=R.n,pct=total?R.right/total:0;
  const wm=WORD_MODES.includes(S.mode);
  const note=pct===1?"Perfect round.":pct>=.8?"Nearly there.":"The ones you missed are listed below.";
  const list=R.wrong.map(it=>{
    if(wm)return `<li><span class="w">${it.jp}</span><span>${it.en}</span></li>`;
    if(S.mode==="num")return `<li><span>${it.prompt}</span><span class="w">${it.jp}</span></li>`;
    if(S.mode==="sit")return `<li><span>${it[0]}</span><span class="w">${it[1]}</span></li>`;
    return `<li><span>${it.en}</span><span class="w">${fmt(it.jp)}</span></li>`;
  }).join("");
  stage.innerHTML=`<div class="bar"><i style="width:100%"></i></div>
  <div class="card" id="card"><div class="score"><span class="big">${R.right}</span>of ${total}${S.mode==="flash"?" known first time":" correct"}</div><p class="end-note">${note}</p></div>
  ${list?`<h2>To review</h2><ul class="misslist">${list}</ul>`:""}
  <div class="actions">${wm&&R.wrong.length?`<button class="btn ghost" id="redo">Practice these ${R.wrong.length}</button>`:""}<button class="btn" id="newr">New round</button></div>`;
  if(pct>=.8)stamp(true);
  live.textContent=`Round finished: ${R.right} of ${total}`;
  const wrong=R.wrong.slice();
  renderControls();
  const redo=$("#redo");if(redo)redo.onclick=()=>startRound(wrong);
  $("#newr").onclick=()=>startRound();
  $("#newr").focus({preventScroll:true});
}

renderControls();
startRound();
</script>
</body>
</html>
